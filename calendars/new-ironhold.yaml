id: new-ironhold
name: New Ironhold
year_zero: true
weekdays: [Prime, Rise, Crest, Wane, Rest]
week: { starts: Prime, reset: never }
months:
  - { name: Prima, days: 35 }
  - { name: Secunda, days: 35 }
  - { name: Tertia, days: 35 }
  - { name: Quarta, days: 35 }
  - { name: Quinta, days: 35 }
  - { name: Sexta, days: 35 }
  - { name: September, days: 35 }
  - { name: October, days: 35 }
  - { name: November, days: 35 }
  - { name: December, days: 35 }
  - { name: Undecima, days: 35 }
eras:
  - { abbr: BTA, name: Before the Treaty of Ashvale, direction: backward }
  - { abbr: ATA, name: After the Treaty of Ashvale, start_year: 0 }
moons:
  - name: Solenne
    color: "#dfe3ea"
    set:
      - { phase: Full, every: month, on: 1 }
      - { phase: Waning, look: waning-gibbous, every: month, on: 2, days: 4 }
  - name: Valora
    color: "#b4472f"
    set:
      - { phase: Full, every: year, on: { month: tertia, day: 22 } }
      - { phase: Full, every: year, on: { month: sexta, day: 17 } }
      - { phase: Full, every: year, on: { month: november, day: 11 } }
      - { phase: Full, every: year, on: { month: undecima, day: 33 } }
  - name: Umbriel
    color: "#7d4f8f"
    set:
      - { phase: Full, every: month, on: 33 }
conjunctions:
  - { name: Sister's Scourge, moons: [Valora, Umbriel], look: full }
